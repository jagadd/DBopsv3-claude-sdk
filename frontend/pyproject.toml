[project]
name = "itsm-mimic"
version = "0.1.0"
description = "ServiceNow-style ITSM mimic: incidents, assignment groups, work notes, DBopsv3 dispatch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itsm_mimic = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
